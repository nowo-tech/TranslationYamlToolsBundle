# Demo security: in-memory admin for the missing-log Web UI.
# Credentials: admin / admin (ROLE_ADMIN). Do not reuse outside local demos.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: plaintext

    providers:
        demo_users:
            memory:
                users:
                    admin:
                        password: admin
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: demo_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: nowo_translation_yaml_tools_missing_log_index
            logout:
                path: app_logout
                target: demo_home

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/_demo/translation-yaml-tools, roles: ROLE_ADMIN }
        - { path: ^/_translation_yaml_tools, roles: ROLE_ADMIN }
