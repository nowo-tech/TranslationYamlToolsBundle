name: translation-yaml-tools-bundle-demo-symfony-7
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: translation-yaml-tools-symfony7-php
    working_dir: /app
    ports:
      - "${PORT:-8037}:80"
    volumes:
      - .:/app
      - ../..:/var/translation-yaml-tools-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
    networks:
      - translation-yaml-tools-demo-symfony7-network

volumes:
  composer-cache:
    driver: local

networks:
  translation-yaml-tools-demo-symfony7-network:
    driver: bridge
