# Dev-only: runtime missing-key log (Doctrine + Web UI). No symfony/messenger: flush uses EventDispatcher.
# Web UI requires SecurityBundle (see config/packages/security.yaml) — ROLE_ADMIN via login admin/admin.
nowo_translation_yaml_tools:
    missing_translation_log:
        enabled: true
        table_prefix: demo_translation_
        record_call_site: true
        record_request_context: true # default; persists request_route, request_method, request_path (schema: doctrine:schema:update)
        async_persist: true
        async_persist_strategy: event_dispatcher
        web_ui:
            enabled: true
            path_prefix: '/_demo/translation-yaml-tools/missing-log'
            security:
                access_roles: [ROLE_ADMIN]
