# UiKit page contract (REQ-UI-003) and REQ-DEMO-014: UiKit's default theme, unchanged (no CSS framework, no CDN, no
# token override); the demo shell (templates/base.html.twig) is the admin layout of every bundle page (the
# missing-translation log and the text-overrides desk render in it).
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: none
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
