services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\TranslationYamlToolsBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../NowoTranslationYamlToolsBundle.php'
            - '../../MachineTranslation/RoutingMachineTranslator.php'
            - '../../MachineTranslation/ThrottledMachineTranslator.php'
            - '../../Entity/'
            - '../../Repository/'
            - '../../Translation/'
            - '../../MissingTranslationLog/'
            - '../../Command/MissingTranslationLog/'
            - '../../Controller/'
            - '../../Doctrine/'
            - '../../Twig/'
            - '../../EventSubscriber/'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\MachineTranslationLocaleMapper:
        arguments:
            $canonicalKeyToApiCode: '%nowo_translation_yaml_tools.machine_translation_locale_map%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\GoogleTranslateMachineTranslator:
        arguments:
            $apiKey: '%env(string:GOOGLE_TRANSLATE_API_KEY)%'
            $httpTimeout: '%nowo_translation_yaml_tools.machine_translation_http_timeout%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\DeeplMachineTranslator:
        arguments:
            $authKey: '%env(string:DEEPL_AUTH_KEY)%'
            $endpointUrl: '%nowo_translation_yaml_tools.deepl_endpoint%'
            $httpTimeout: '%nowo_translation_yaml_tools.machine_translation_http_timeout%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\LibreTranslateBaseUrlGuard:
        arguments:
            $allowedHosts: '%nowo_translation_yaml_tools.libretranslate_allowed_hosts%'
            $allowHttp: '%nowo_translation_yaml_tools.libretranslate_allow_http%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\LibreTranslateMachineTranslator:
        arguments:
            $baseUrl: '%nowo_translation_yaml_tools.libretranslate_base_url%'
            $apiKey: '%nowo_translation_yaml_tools.libretranslate_api_key%'
            $baseUrlGuard: '@Nowo\TranslationYamlToolsBundle\MachineTranslation\LibreTranslateBaseUrlGuard'
            $httpTimeout: '%nowo_translation_yaml_tools.machine_translation_http_timeout%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\RoutingMachineTranslator:
        arguments:
            $translators:
                google: '@Nowo\TranslationYamlToolsBundle\MachineTranslation\GoogleTranslateMachineTranslator'
                deepl: '@Nowo\TranslationYamlToolsBundle\MachineTranslation\DeeplMachineTranslator'
                libretranslate: '@Nowo\TranslationYamlToolsBundle\MachineTranslation\LibreTranslateMachineTranslator'
            $defaultBackend: '%nowo_translation_yaml_tools.machine_translator%'
            $byCanonicalLocale: '%nowo_translation_yaml_tools.machine_translator_by_locale%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\ThrottledMachineTranslator:
        arguments:
            $inner: '@Nowo\TranslationYamlToolsBundle\MachineTranslation\RoutingMachineTranslator'
            $minIntervalMs: '%nowo_translation_yaml_tools.machine_translation_min_interval_ms%'

    Nowo\TranslationYamlToolsBundle\MachineTranslation\MachineTranslatorInterface:
        alias: Nowo\TranslationYamlToolsBundle\MachineTranslation\ThrottledMachineTranslator

    Nowo\TranslationYamlToolsBundle\Command\TranslationYamlTreeCommand:
        arguments:
            $configuredIndent: '%nowo_translation_yaml_tools.yaml_tree_indent%'
            $configuredLeafPrefixSuffix: '%nowo_translation_yaml_tools.yaml_tree_leaf_prefix_suffix%'

    Nowo\TranslationYamlToolsBundle\Command\TranslationYamlSortCommand:
        arguments:
            $configuredIndent: '%nowo_translation_yaml_tools.yaml_tree_indent%'

    Nowo\TranslationYamlToolsBundle\Command\TranslationYamlFlattenCommand:
        arguments:
            $configuredIndent: '%nowo_translation_yaml_tools.yaml_tree_indent%'

    Nowo\TranslationYamlToolsBundle\Command\TranslationYamlFillMissingCommand:
        arguments:
            $bundleDefaultLocaleOverride: '%nowo_translation_yaml_tools.default_locale%'
            $configuredIndent: '%nowo_translation_yaml_tools.yaml_tree_indent%'
            $machineTranslatorBackend: '%nowo_translation_yaml_tools.machine_translator%'
            $machineTranslatorPerLocaleEnabled: '%nowo_translation_yaml_tools.machine_translator_per_locale%'
            $maxRequestsPerRun: '%nowo_translation_yaml_tools.machine_translation_max_requests_per_run%'

    Nowo\TranslationYamlToolsBundle\Command\TranslationYamlAuditCommand:
        arguments:
            $bundleDefaultLocaleOverride: '%nowo_translation_yaml_tools.default_locale%'
