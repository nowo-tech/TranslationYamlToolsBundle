# Translation YAML Tools — optional dev tooling for YAML translation files.
# See docs/CONFIGURATION.md and docs/USAGE.md.

nowo_translation_yaml_tools:
    # default_locale: null   # null = use Symfony translator.default_locale
    yaml_tree_indent: 4
    yaml_tree_leaf_prefix_suffix: index   # final segment for tree --fix-leaf-prefix (e.g. key a -> a.index)
    machine_translator: google
    # machine_translation_min_interval_ms: 0          # e.g. 100–250 for public API pacing
    # machine_translation_max_requests_per_run: 0     # e.g. 200 to cap fill-missing burns
    # machine_translation_http_timeout: 30
    # libretranslate_base_url: 'https://libretranslate.com'
    # libretranslate_allowed_hosts: [libretranslate.com]   # required host allowlist (SSRF)
    # libretranslate_allow_http: false
    # machine_translation_locale_map:
    #     pt_BR: pt-br   # optional: Symfony locale => exact API language code for fill-missing
    # machine_translator_by_locale:
    #     pt_BR: libretranslate   # optional: Symfony locale => google | deepl | libretranslate
    # missing_translation_log:
    #     enabled: true   # optional: Doctrine table for runtime missing keys (requires doctrine/orm + doctrine-bundle)
    #     table_prefix: nowo_translation_   # table name = prefix + "missing_log"
    #     record_call_site: true   # store caller file:line in call_site (debug_backtrace); false = less overhead
    #     record_request_context: true   # persist request_route, request_method, request_path when an HTTP Request exists; false = privacy
    #     async_persist: false     # true: delegate flush (see async_persist_strategy)
    #     async_persist_strategy: messenger   # messenger | event_dispatcher (no Messenger; use MissingTranslationBufferEvent + optional stopPropagation)
    #     web_ui:
    #         enabled: true   # requires symfony/twig-bundle + symfony/security-bundle; import routes (see recipe config/routes/dev/)
    #         path_prefix: '/_translation_yaml_tools/missing-log'
    #         required_role: ROLE_ADMIN
    #         # allow_unauthenticated: false   # default; never true in production
    #
    # Also protect with access_control, e.g.:
    # security:
    #     access_control:
    #         - { path: ^/_translation_yaml_tools, roles: ROLE_ADMIN }
