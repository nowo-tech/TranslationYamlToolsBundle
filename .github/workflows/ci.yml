name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['7.0', '7.4', '8.0', '8.1']
        exclude:
          # Symfony 8.x requires PHP >=8.4 (8.1.x requires PHP >=8.4.1).
          - php: '8.2'
            symfony: '8.0'
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.0'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          composer require \
            symfony/config:^${{ matrix.symfony }} \
            symfony/console:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/http-client:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            symfony/translation:^${{ matrix.symfony }} \
            symfony/yaml:^${{ matrix.symfony }} \
            --no-interaction --no-update
          composer require --dev \
            symfony/browser-kit:^${{ matrix.symfony }} \
            symfony/messenger:^${{ matrix.symfony }} \
            symfony/security-csrf:^${{ matrix.symfony }} \
            symfony/twig-bundle:^${{ matrix.symfony }} \
            symfony/var-exporter:^${{ matrix.symfony }} \
            --no-interaction --no-update
          UPDATE_PKGS='symfony/*'
          case '${{ matrix.symfony }}' in
            8.*)
              # doctrine/doctrine-bundle 2.x does not support Symfony 8; 3.1+ does.
              composer require --dev doctrine/doctrine-bundle:^3.1 --no-interaction --no-update
              UPDATE_PKGS="$UPDATE_PKGS doctrine/doctrine-bundle"
              ;;
          esac
          composer update $UPDATE_PKGS --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        env:
          GOOGLE_TRANSLATE_API_KEY: ''
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        env:
          GOOGLE_TRANSLATE_API_KEY: ''
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test-coverage

      - name: Validate coverage file
        if: matrix.php == '8.2'
        run: test -f coverage.xml

  cs-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check
